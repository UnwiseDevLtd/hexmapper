<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Mapper</title>
<style>
  :root{
    --bg:#1b1d22; --panel:#252830; --panel2:#2e323c; --line:#3a3f4b;
    --tx:#e7e9ee; --dim:#9aa0ad; --acc:#6ea8fe; --acc2:#84d6a1; --warn:#e27075;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font:13px/1.4 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;display:flex;overflow:hidden}
  /* left: app (toolbar + canvas) */
  #app{flex:1;display:flex;flex-direction:column;min-width:0}
  /* toolbar */
  #toolbar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:4px 6px;flex-wrap:wrap;min-height:36px}
  .tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--tx);font:inherit;font-size:11px;white-space:nowrap}
  .tbtn:hover{border-color:var(--acc)}
  .tbtn.on{border-color:var(--acc);background:#2c3243}
  .sep{width:1px;height:18px;background:var(--line);margin:0 2px;flex-shrink:0}
  .spacer{margin-left:auto}
  /* dropdown */
  .dropdown{position:relative}
  .dropdown-menu{display:none;position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;z-index:100;min-width:130px;max-height:400px;overflow-y:auto}
  .dropdown:hover .dropdown-menu,.dropdown.open .dropdown-menu{display:block}
  .ditem{display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;color:var(--tx);font-size:12px;border-radius:4px;width:100%;text-align:left;background:none;border:none}
  .ditem:hover{background:var(--panel2)}
  .ditem.on{color:var(--acc)}
  .ditem .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.3)}
  .dsub{font-size:9px;color:var(--dim);margin:3px 0 1px;padding-top:2px;border-top:1px solid var(--line)}
  /* status bar */
  #bar{height:26px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 10px;font-size:11px;color:var(--dim)}
  #bar b{color:var(--tx)}
  /* stage */
  #stage{flex:1;position:relative;overflow:hidden;cursor:crosshair;background:#15161a}
  #stage.panning{cursor:grab}
  #stage.panning:active{cursor:grabbing}
  #stage.textmode{cursor:text}
  canvas{position:absolute;inset:0;display:block;touch-action:none}
  /* right dock */
  #dock{width:200px;flex:0 0 200px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #dock-scroll{flex:1;overflow-y:auto;padding:8px}
  .dock-footer{flex-shrink:0;padding:6px 8px;text-align:center;font-size:10px;border-top:1px solid var(--line)}
  .dock-footer a{color:var(--dim);text-decoration:none}
  /* collapses in dock */
  .collapse{margin-bottom:4px}
  .collapse-head{display:flex;align-items:center;gap:6px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--tx);font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
  .collapse-head:hover{border-color:var(--acc)}
  .collapse-head .ttl{flex:1}
  .collapse-head .caret{color:var(--dim);transition:transform .15s}
  .collapse.open .collapse-head .caret{transform:rotate(90deg)}
  .collapse-body{display:none;padding:6px 2px 2px}
  .collapse.open .collapse-body{display:block}
  /* form elements */
  label{display:block;margin:6px 0 2px;color:var(--dim);font-size:10px}
  input[type=range]{width:100%}
  input[type=text],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 6px;font-size:11px;font-family:inherit}
  input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:4px;flex-wrap:wrap}
  .row.tight{gap:3px}
  button.act{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 6px;cursor:pointer;font-size:11px;flex:1}
  button.act:hover{border-color:var(--acc)}
  button.act.on{border-color:var(--acc);background:#2c3243}
  button.act.danger{color:#f4b3b6}
  button.act.danger:hover{border-color:var(--warn)}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  input[type=file]{display:none}
  .filebtn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px;width:100%;text-align:center}
  .filebtn:hover{border-color:var(--acc)}
  .hint{color:var(--dim);font-size:10px;margin-top:3px}
  code{background:var(--bg);padding:1px 4px;border-radius:3px;color:var(--acc2);font-size:10px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:11px;cursor:pointer}
  .chk input{margin:0}
  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,80,140,.25);border:2px dashed var(--acc);pointer-events:none;font-size:16px;color:var(--tx)}
  #stage.drag #drop{display:flex}
  #textpanel{background:#1f2229;border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:4px}
</style>
</head>
<body>

<div id="app">
  <div id="toolbar"></div>
  <div id="bar">
    <span>Tool: <b id="curtool">Trees</b></span>
    <span>Hex: <b id="curhex">—</b></span>
    <span>Zoom: <b id="curzoom">100%</b></span>
    <span style="margin-left:auto" id="dims">100 × 100 hexes</span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="drop">Drop image to use as background</div>
  </div>
</div>

<div id="dock">
  <div id="dock-scroll">

    <div id="textpanel" style="display:none">
      <div class="hint" id="texthint" style="margin:0 0 4px">Click the map to add a label.</div>
      <label>Label</label>
      <input id="txt" type="text" placeholder="Label text…" autocomplete="off">
      <label>Font size <span id="tsv">14</span></label>
      <input id="txtsize" type="range" min="6" max="48" value="14">
      <div class="row" style="margin-top:6px">
        <button class="act danger" id="txtdelete" disabled>Delete</button>
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Background</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <label class="filebtn" for="bgfile" id="bglabel">Upload map image…</label>
        <input type="file" id="bgfile" accept="image/*">
        <div class="hint" id="bgstatus">No background loaded.</div>
        <label>Opacity <span id="opv">80%</span></label>
        <input type="range" id="bgop" min="0" max="100" value="80">
        <label>Scale <span id="scv">100%</span></label>
        <input type="range" id="bgscale" min="20" max="400" value="100">
        <label>Nudge X / Y</label>
        <div class="row">
          <input type="range" id="bgx" min="-400" max="400" value="0" style="flex:1">
          <input type="range" id="bgy" min="-400" max="400" value="0" style="flex:1">
        </div>
        <label>Backdrop <input type="color" id="bgcol" value="#ffffff" style="width:100%;height:22px;margin-top:2px"></label>
        <div class="row" style="margin-top:4px">
          <button class="act" id="bgfit">Fit</button>
          <button class="act" id="bgclear">Remove</button>
        </div>
        <label class="chk" style="margin-top:4px"><input type="checkbox" id="bgabove"> Above tiles</label>
      </div>
    </div>

    <div class="collapse open">
      <button class="collapse-head" type="button"><span class="ttl">Map style</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row tight">
          <button class="act on" data-vs="color">Colour</button>
          <button class="act" data-vs="bw">B&amp;W</button>
        </div>
        <label>Density <span id="hdv">80%</span></label>
        <input type="range" id="hdens" min="10" max="100" value="80">
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Grid</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row tight">
          <label style="margin:0;flex:1">Cols <input type="number" id="colsin" value="100" min="1" max="400" style="margin-top:2px"></label>
          <label style="margin:0;flex:1">Rows <input type="number" id="rowsin" value="100" min="1" max="400" style="margin-top:2px"></label>
        </div>
        <div class="row" style="margin-top:4px">
          <button class="act" id="dimapply">Apply</button>
          <button class="act" id="rotate">Rotate</button>
        </div>
        <label class="chk" style="margin-top:4px"><input type="checkbox" id="idshow"> Hex IDs (BC-23)</label>
        <label>Size <span id="idsv">9</span></label>
        <input type="range" id="idsz" min="6" max="20" value="9">
        <div class="row tight" style="margin-top:4px">
          <button class="act" id="idbg">BG: none</button>
          <button class="act" id="idpos">Pos: center</button>
        </div>
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Export</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row">
          <button class="act" id="export">PNG</button>
          <button class="act" id="save">JSON</button>
        </div>
        <label class="filebtn" for="loadfile" style="margin-top:4px">Load JSON…</label>
        <input type="file" id="loadfile" accept="application/json,.json">
        <div class="row" style="margin-top:6px">
          <button class="act" id="zin">Zoom +</button>
          <button class="act" id="zout">Zoom −</button>
        </div>
        <div class="row tight" style="margin-top:3px">
          <button class="act" id="zfit">Fit</button>
          <button class="act" id="z1">1:1</button>
          <button class="act" id="undo" disabled>↶</button>
          <button class="act" id="redo" disabled>↷</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="act danger" id="clear">Clear all</button>
        </div>
        <div class="hint" style="margin-top:6px">Right-click erases · <code>Ctrl+Z</code>/<code>Ctrl+Shift+Z</code></div>
      </div>
    </div>

  </div>
  <div class="dock-footer">
    <a href="https://github.com/UnwiseDevLtd/hexmapper" target="_blank">GitHub</a> · <a href="https://www.patreon.com/cw/UnwiseDev" target="_blank">Patreon</a>
  </div>
</div>

function resize(){
const dpr=Math.min(window.devicePixelRatio||1,2);
const w=stage.clientWidth,h=stage.clientHeight;
cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
cv.style.width=w+"px"; cv.style.height=h+"px";
ctx.setTransform(dpr,0,0,dpr,0,0);
render();
}
window.addEventListener("resize",resize);

const VERTS=[[0,-S],[W/2,-S/2],[W/2,S/2],[0,S],[-W/2,S/2],[-W/2,-S/2]];
const AXIAL_DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const EDGE_MID =[[W/2,0],[W/4,-3*S/4],[-W/4,-3*S/4],[-W/2,0],[-W/4,3*S/4],[W/4,3*S/4]];
const EDGEDIR=[1,0,5,4,3,2];
function neighbors(c,r){
const q0=c-((r-(r&1))>>1), r0=r, out=[];
for(const [dq,dr] of AXIAL_DIRS){ const q=q0+dq, rr=r0+dr; out.push([q+((rr-(rr&1))>>1), rr]); }
return out;
}
function hexPath(g,cx,cy){
g.beginPath(); g.moveTo(cx,cy-S);
g.lineTo(cx+W/2,cy-S/2); g.lineTo(cx+W/2,cy+S/2);
g.lineTo(cx,cy+S);
g.lineTo(cx-W/2,cy+S/2); g.lineTo(cx-W/2,cy-S/2);
g.closePath();
}
function clientToWorld(x,y){ const rc=cv.getBoundingClientRect(); return [(x-rc.left-cam.x)/cam.z,(y-rc.top-cam.y)/cam.z]; }
function worldToHex(x,y){
const px=x-(PAD+W/2), py=y-(PAD+S);
const q=(Math.sqrt(3)/3*px-1/3*py)/S, r=(2/3*py)/S, s=-q-r;
let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);
const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);
if(dq>dr&&dq>ds) rq=-rr-rs; else if(dr>ds) rr=-rq-rs;
return [rq+((rr-(rr&1))>>1), rr];
}
function bijective(n){ let s=""; while(n>0){ n--; s=String.fromCharCode(65+n%26)+s; n=Math.floor(n/26); } return s; }
function hexId(c,r){ return bijective(r+1)+"-"+(c+1); }
// ===================== src/03-merge.js =====================
function tKey(c,r){ const t=terrain[idx(c,r)]; return (t>=9&&t<=12)?("t"+t):null; }
function cKey(c,r){ return entity[idx(c,r)]===2?"city":null; }
function outlineHex(g,c,r,keyFn){
const [cx,cy]=center(c,r), self=keyFn(c,r), ns=neighbors(c,r);
if(!self){ hexPath(g,cx,cy); g.stroke(); return; }
for(let i=0;i<6;i++){
const [nc,nr]=ns[EDGEDIR[i]];
let same=false;
if(inB(nc,nr)&&self===keyFn(nc,nr)) same=true;
if(!same){ const a=VERTS[i],b=VERTS[(i+1)%6]; g.beginPath(); g.moveTo(cx+a[0],cy+a[1]); g.lineTo(cx+b[0],cy+b[1]); g.stroke(); }
}
}
// ===================== src/04-draw.js =====================
function tree(g,x,y,sz,col){
g.fillStyle=col;
g.beginPath(); g.moveTo(x,y-sz*0.5); g.lineTo(x+sz*0.32,y+sz*0.2); g.lineTo(x-sz*0.32,y+sz*0.2); g.closePath(); g.fill();
g.fillRect(x-sz*0.06,y+sz*0.16,sz*0.12,sz*0.22);
}
function waveH(g,cx,cy,scale){
g.lineWidth=S*0.12*scale; g.beginPath();
const x0=cx-S*0.42, x1=cx+S*0.42, steps=4, dx=(x1-x0)/steps;
g.moveTo(x0,cy);
for(let i=1;i<=steps;i++){ const mx=x0+dx*(i-0.5),xx=x0+dx*i; g.quadraticCurveTo(mx,cy+(i%2?S*0.1:-S*0.1),xx,cy); }
g.stroke();
}
function drawTerrain(g,id,cx,cy,ovr){
if(!TERR[id]) return;
const sym=ovr||TERR[id].sym; g.fillStyle=sym; g.strokeStyle=sym; g.lineJoin="round"; g.lineCap="round";
switch(id){
case 3: g.lineWidth=S*0.07; for(const [tx,ty] of [[-0.25,0.12],[0.05,-0.06],[0.25,0.16]]){ g.beginPath(); g.moveTo(cx+tx*S,cy+ty*S); g.lineTo(cx+tx*S,cy+(ty-0.13)*S); g.stroke(); } break;
case 4: g.lineWidth=S*0.13; g.beginPath();
g.moveTo(cx-S*0.42,cy+S*0.28); g.lineTo(cx-S*0.2,cy-S*0.05); g.lineTo(cx+S*0.02,cy+S*0.28);
g.moveTo(cx-S*0.02,cy+S*0.28); g.lineTo(cx+S*0.2,cy-S*0.05); g.lineTo(cx+S*0.42,cy+S*0.28);
g.stroke(); break;
case 5: for(const [tx,ty] of [[-0.2,0.1],[0.1,-0.06],[0.22,0.2],[-0.08,-0.16]]){ g.beginPath(); g.arc(cx+tx*S,cy+ty*S,S*0.045,0,7); g.fill(); } break;
case 6: g.lineWidth=S*0.14; g.beginPath();
g.arc(cx-S*0.28,cy+S*0.12,S*0.3,Math.PI*1.05,Math.PI*1.95);
g.arc(cx+S*0.28,cy+S*0.12,S*0.3,Math.PI*1.05,Math.PI*1.95);
g.stroke(); break;
case 7: g.beginPath(); g.moveTo(cx,cy-S*0.36); g.lineTo(cx+S*0.34,cy+S*0.22); g.lineTo(cx-S*0.34,cy+S*0.22); g.closePath(); g.fill(); break;
case 8: // large mountain: small peak overlaid on a larger back peak
g.save();
g.fillStyle="#9aa0ad";
g.beginPath(); g.moveTo(cx-S*0.05,cy-S*0.46); g.lineTo(cx+S*0.44,cy+S*0.3); g.lineTo(cx-S*0.46,cy+S*0.3); g.closePath(); g.fill();
g.fillStyle="#ffffff";
g.beginPath(); g.moveTo(cx+S*0.08,cy-S*0.24); g.lineTo(cx+S*0.42,cy+S*0.3); g.lineTo(cx-S*0.30,cy+S*0.3); g.closePath(); g.fill();
g.restore();
break;
case 9: waveH(g,cx,cy,1); break;
case 10: waveH(g,cx,cy,1); waveH(g,cx,cy-S*0.24,0.8); break;
case 11: waveH(g,cx,cy,1); break;
case 12: waveH(g,cx,cy,1); waveH(g,cx,cy-S*0.24,0.8); break;
case 13: g.lineWidth=S*0.1; waveH(g,cx,cy+S*0.18,0.9); g.lineWidth=S*0.06;
for(const tx of [-0.2,0.05,0.25]){ const ty=-0.05; g.beginPath(); g.moveTo(cx+tx*S,cy+ty*S); g.lineTo(cx+tx*S,cy+ty*S-S*0.22); g.stroke(); }
break;
case 14: g.lineWidth=S*0.07; for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(cx-S*0.4,cy+i*S*0.18); g.lineTo(cx+S*0.4,cy+i*S*0.18-S*0.16); g.stroke(); } break;
}
}

function isSettlement(e){ return e===1||e===2||e===6; }
function settlementNeighbors(c,r){
const ns=neighbors(c,r); let n=0;
for(const [nc,nr] of ns){ if(inB(nc,nr)&&isSettlement(entity[idx(nc,nr)])) n++; }

}

// ===================== src/05-overlay.js =====================
function sep6(a,b){ let d=Math.abs(a-b)%6; return d>3?6-d:d; }
// Orient every connected cluster of SHARED edges (river+road on the same link):
// DFS from degree-1 endpoints first (so a path flows end-to-end one way), then
// any leftover (cycles / junctions). For each oriented edge a->b store the unit
// left-bank perpendicular (rotate travel-vector 90 CCW) at both endpoints.
// River uses the left bank, road the right (opposite sign) -> consistent side
// through every bend, determined by travel direction (rotation), not compass.
function computeBankOffsets(){
const adj=new Map();
for(const e of overlayEdges.values()){
if(!(e.river!==0 && e.road===1)) continue;
const ai=e.a[1]*COLS+e.a[0], bi=e.b[1]*COLS+e.b[0];
if(!adj.has(ai)) adj.set(ai,[]); adj.get(ai).push(bi);
if(!adj.has(bi)) adj.set(bi,[]); adj.get(bi).push(ai);
}
const bank=new Map(), oriented=new Set();
const ek=(a,b)=>a<b?a+":"+b:b+":"+a;
const setFlow=(a,b)=>{
const ac=a%COLS, ar=(a/COLS|0), bc=b%COLS, br=(b/COLS|0);
const [ax,ay]=center(ac,ar), [bx,by]=center(bc,br);
let vx=bx-ax, vy=by-ay; const L=Math.hypot(vx,vy)||1; vx/=L; vy/=L;
const perp=[-vy, vx];
const nsa=neighbors(ac,ar); let da=0; for(let i=0;i<6;i++){ if(nsa[i][0]===bc&&nsa[i][1]===br){da=i;break;} }
const nsb=neighbors(bc,br); let db=0; for(let i=0;i<6;i++){ if(nsb[i][0]===ac&&nsb[i][1]===ar){db=i;break;} }
bank.set(a*6+da, perp); bank.set(b*6+db, perp);
};
const dfs=(seed)=>{ const st=[seed]; while(st.length){ const u=st[st.length-1]; const nb=adj.get(u)||[]; let adv=false; for(const v of nb){ const k=ek(u,v); if(oriented.has(k)) continue; setFlow(u,v); oriented.add(k); st.push(v); adv=true; break; } if(!adv) st.pop(); } };
for(const [u,nb] of adj) if(nb.length===1) dfs(u);
for(const u of adj.keys()){ for(const v of adj.get(u)){ if(!oriented.has(ek(u,v))){ dfs(u); break; } } }
return bank;
}
// smooth segments through one tile. Pair farthest directions (through-path):
// opposite => straight, else quadratic via the centre; odd one out => spoke.
// Offsetting is per shared midpoint (left/right bank of the oriented shared
// edge); the centre is offset only when every connection is shared, so shared
// edges meet offset-to-offset and shared->single transitions meet centred.
function drawSegments(g, cx, cy, mids, smask, i, offMap){
if(mids.length<1) return;
let allShared=true, cox=0, coy=0, cn=0;
for(const d of mids){
if(smask&(1<<d)){ const o=offMap.get(i*6+d); if(o){ cox+=o[0]; coy+=o[1]; cn++; } else allShared=false; }
else allShared=false;
}
if(cn>1){ cox/=cn; coy/=cn; }
const useC = allShared && cn>0;
const cenx=cx+(useC?cox:0), ceny=cy+(useC?coy:0);
const mp=d=>{ const [mx,my]=EDGE_MID[d]; const o=(smask&(1<<d))?offMap.get(i*6+d):null; return [cx+mx+(o?o[0]:0), cy+my+(o?o[1]:0)]; };
let pool=mids.slice();
while(pool.length>=2){
let bi=0,bj=1,bs=-1;
for(let ii=0;ii<pool.length;ii++) for(let jj=ii+1;jj<pool.length;jj++){ const s=sep6(pool[ii],pool[jj]); if(s>bs){bs=s;bi=ii;bj=jj;} }
const d1=pool[bi], d2=pool[bj];
const [ax,ay]=mp(d1), [bx,by]=mp(d2);
g.beginPath(); g.moveTo(ax,ay);
if(bs===3) g.lineTo(bx,by); else g.quadraticCurveTo(cenx,ceny,bx,by);

function drawEdges(g, type, color, dashed, bank){
const isRoad = type===3;

const sign = isRoad ? -1 : 1, dlt = S*0.2;
const offMap=new Map();
for(const e of overlayEdges.values()){
const ns=neighbors(e.a[0],e.a[1]);
let d=-1; for(let i=0;i<6;i++){ if(ns[i][0]===e.b[0]&&ns[i][1]===e.b[1]){ d=i; break; } }
if(d<0) continue;
const ai=e.a[1]*COLS+e.a[0], bi=e.b[1]*COLS+e.b[0];
const hasT = isRoad ? e.road===1 : e.river===type;
if(hasT){ mask[ai]|=(1<<d); mask[bi]|=(1<<((d+3)%6)); }
const hasOther = isRoad ? e.river!==0 : e.road===1;
if(hasT && hasOther){
smask[ai]|=(1<<d); smask[bi]|=(1<<((d+3)%6));
const pa=bank.get(ai*6+d); if(pa) offMap.set(ai*6+d,[pa[0]*sign*dlt,pa[1]*sign*dlt]);
const pb=bank.get(bi*6+((d+3)%6)); if(pb) offMap.set(bi*6+((d+3)%6),[pb[0]*sign*dlt,pb[1]*sign*dlt]);

g.save(); g.strokeStyle=color; g.lineWidth=dashed?S*0.13:S*0.18; g.lineCap=dashed?"butt":"round"; g.lineJoin="round";

const i=r*COLS+c, m=mask[i]; if(!m) continue;
const dirs=[]; for(let d=0;d<6;d++) if(m&(1<<d)) dirs.push(d);
const [cx,cy]=center(c,r);
drawSegments(g, cx, cy, dirs, smask[i], i, offMap);
}
if(dashed) g.setLineDash([]);
g.restore();

let history=[], histPtr=-1, lastKind=null, lastTime=0;
const HIST_MAX=100;
function snapshot(){
return {cols:COLS,rows:ROWS,
terrain:terrain.slice(), veg:veg.slice(), entity:entity.slice(),
texts:texts.map(t=>({...t})),
edges:[...overlayEdges.values()].map(e=>({a:[e.a[0],e.a[1]],b:[e.b[0],e.b[1]],river:e.river,road:e.road}))};
}
function restore(s){
COLS=s.cols; ROWS=s.rows; recomputeGrid();
allocArrays();
terrain.set(s.terrain); if(s.veg) veg.set(s.veg); if(s.entity) entity.set(s.entity);
overlayEdges=new Map((s.edges||[]).map(e=>{ const n=normEdge(e); return [edgeKeyOf(n.a,n.b),n]; }));
texts=s.texts.map(t=>({...t})); selText=-1; dirty=true; updateDims(); syncTextPanel(); fitGrid(); render();
}
function commit(kind){
const now=Date.now(), snap=snapshot();
if(kind==="text"&&lastKind==="text"&&now-lastTime<500&&histPtr>=0&&histPtr===history.length-1){
history[histPtr]=snap;
} else {
history=history.slice(0,histPtr+1); history.push(snap);
if(history.length>HIST_MAX) history.shift();
histPtr=history.length-1;
}
lastKind=kind; lastTime=now; updateHistButtons();
}
function undo(){ if(histPtr<=0) return; histPtr--; restore(history[histPtr]); lastKind=null; updateHistButtons(); scheduleSave(true); }
function redo(){ if(histPtr>=history.length-1) return; histPtr++; restore(history[histPtr]); lastKind=null; updateHistButtons(); scheduleSave(true); }

function allocArrays(){
terrain=new Uint8Array(ROWS*COLS); veg=new Uint8Array(ROWS*COLS); entity=new Uint8Array(ROWS*COLS);
}
function updateDims(){
dimsEl.textContent=`${COLS} × ${ROWS} hexes`;
document.getElementById("colsin").value=COLS; document.getElementById("rowsin").value=ROWS;
}
// ---- edge helpers (rivers/roads) ----
// an edge carries BOTH a river (0/1 water /2 lava) AND a road (0/1), so a river
// and a road can share the same tile-tile connection.
function edgeKeyOf(a,b){
const [ac,ar]=a,[bc,br]=b;
return (ar<br||(ar===br&&ac<bc)) ? ar+","+ac+"|"+br+","+bc : br+","+bc+"|"+ar+","+ac;
}
function addEdge(a,b,type){
const k=edgeKeyOf(a,b);
let e=overlayEdges.get(k);
if(!e){ e={a:[a[0],a[1]],b:[b[0],b[1]],river:0,road:0}; overlayEdges.set(k,e); }
if(type===1||type===2) e.river=type; else if(type===3) e.road=1;
dirty=true;
}
function eraseEdgesAt(c,r,type){
for(const [k,e] of overlayEdges){
if(!((e.a[0]===c&&e.a[1]===r)||(e.b[0]===c&&e.b[1]===r))) continue;
if(type<=2) e.river=0; else e.road=0;
if(e.river===0 && e.road===0) overlayEdges.delete(k);
}
dirty=true;
}
function tilesAdjacent(a,b){ const ns=neighbors(a[0],a[1]); for(const [nc,nr] of ns){ if(nc===b[0]&&nr===b[1]) return true; } return false; }
// accept either the new {river,road} shape or the legacy single-{type} shape
function normEdge(e){
const river=e.river||((e.type===1||e.type===2)?e.type:0);
const road=e.road||(e.type===3?1:0);
return {a:[e.a[0],e.a[1]],b:[e.b[0],e.b[1]],river,road};
}
// TEMP seed stub: convert legacy tile-based rivers/roads arrays into edges.
function seedEdgesFromTiles(tileRivers, tileRoads){
const pick=(c,r,d,arr,match,type)=>{ const ns=neighbors(c,r); const [nc,nr]=ns[d]; if(inB(nc,nr)&&arr[nr*COLS+nc]===match) addEdge([c,r],[nc,nr],type); };
if(tileRivers) for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const t=tileRivers[r*COLS+c]; if(t===1||t===2) for(let d=0;d<3;d++) pick(c,r,d,tileRivers,t,t); }
if(tileRoads)  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ if(tileRoads[r*COLS+c]) for(let d=0;d<3;d++) pick(c,r,d,tileRoads,1,3); }
}
function resizeGrid(newCols,newRows){
newCols=Math.max(1,Math.min(400,newCols|0)); newRows=Math.max(1,Math.min(400,newRows|0));
if(newCols===COLS&&newRows===ROWS) return;
const nt=new Uint8Array(newRows*newCols), nv=new Uint8Array(newRows*newCols), ne=new Uint8Array(newRows*newCols);
const cmax=Math.min(COLS,newCols), rmax=Math.min(ROWS,newRows);
for(let r=0;r<rmax;r++) for(let c=0;c<cmax;c++){ const o=r*COLS+c, n=r*newCols+c; nt[n]=terrain[o]; nv[n]=veg[o]; ne[n]=entity[o]; }

const fe=new Map();
for(const e of overlayEdges.values()){ if(inB(e.a[0],e.a[1])&&inB(e.b[0],e.b[1])) fe.set(edgeKeyOf(e.a,e.b),e); }

function transposeGrid(){

const nedges=new Map();

let strokeVal=0, strokeErasing=false;
// tile tools (terrain / veg / entity). rivers & roads are edges, handled in the pointer.
function applyTool(c,r){
if(!inB(c,r)) return;
const i=idx(c,r);
if(strokeErasing){
if(active.kind==="terrain") terrain[i]=0;
else if(active.kind==="veg") veg[i]=0;
else if(active.kind==="entity") entity[i]=0;
} else {
if(active.kind==="terrain") terrain[i]=active.id;
else if(active.kind==="veg") veg[i]=strokeVal;
else if(active.kind==="entity") entity[i]=active.id;
}
dirty=true;
}
function paintLine(c0,r0,c1,r1){
const dc=c1-c0, dr=r1-r0, steps=Math.max(Math.abs(dc),Math.abs(dr));
if(steps===0){ applyTool(c1,r1); return; }
for(let s=0;s<=steps;s++) applyTool(Math.round(c0+dc*s/steps),Math.round(r0+dr*s/steps));
}
function floodFill(c,r){
if(!inB(c,r) || active.kind!=="terrain") return false;
const newVal=active.id, old=terrain[idx(c,r)]; if(old===newVal) return false;
const seen=new Uint8Array(ROWS*COLS), stack=[[c,r]]; let n=0;
while(stack.length){
const [cc,rr]=stack.pop(); if(!inB(cc,rr)) continue; const i=idx(cc,rr); if(seen[i]||terrain[i]!==old) continue;
seen[i]=1; terrain[i]=newVal; n++; if(n>ROWS*COLS) break;
for(const [nc,nr] of neighbors(cc,rr)) stack.push([nc,nr]);
}
dirty=true; return n>0;
}

function densityToGray(d){ const v=Math.round(240-d/100*200); const h=v.toString(16).padStart(2,"0"); return "#"+h+h+h; }
function buildHatchPatterns(g, stroke){
const ts=10;
const P={}, mk=(fn)=>{ const c=document.createElement("canvas"); c.width=ts; c.height=ts; fn(c.getContext("2d")); return g.createPattern(c,null); };
P[3]=mk(h=>{h.fillStyle=stroke;h.fillRect(3,3,1.5,1.5);h.fillRect(7,7,1.5,1.5);});
P[4]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,ts);h.lineTo(ts,0);h.stroke();});
P[5]=mk(h=>{});
P[6]=mk(h=>{h.fillStyle=stroke;for(let i=0;i<ts;i+=3)for(let j=0;j<ts;j+=3)h.fillRect(i,j,1,1);});
P[7]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,ts);h.lineTo(ts,0);h.moveTo(3,ts);h.lineTo(ts,3);h.stroke();});
P[8]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,ts);h.lineTo(ts,0);h.moveTo(3,ts);h.lineTo(ts,3);h.moveTo(0,7);h.lineTo(7,0);h.stroke();});
P[9]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,3);h.lineTo(ts,3);h.moveTo(0,7);h.lineTo(ts,7);h.stroke();});
P[10]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,2);h.lineTo(ts,2);h.moveTo(0,5);h.lineTo(ts,5);h.moveTo(0,8);h.lineTo(ts,8);h.stroke();});
P[11]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,0);h.lineTo(ts,ts);h.moveTo(ts,0);h.lineTo(0,ts);h.stroke();});
P[12]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,0);h.lineTo(ts,ts);h.moveTo(ts,0);h.lineTo(0,ts);h.moveTo(0,5);h.lineTo(5,0);h.moveTo(5,ts);h.lineTo(ts,5);h.stroke();});
P[13]=mk(h=>{h.strokeStyle=stroke;h.lineWidth=.5;h.beginPath();h.moveTo(0,4);h.lineTo(5,4);h.moveTo(7,4);h.lineTo(ts,4);h.stroke();});
P[14]=mk(h=>{});
return P;
}

document.getElementById("loadfile").addEventListener("change",e=>{
const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
rd.onload=()=>{
let d;
try{ d=JSON.parse(rd.result); }catch(err){ alert("File is not valid JSON: "+err.message); return; }
try{ if(d.cols&&d.rows){ COLS=d.cols; ROWS=d.rows; recomputeGrid(); allocArrays(); } }catch(_){}
try{ if(d.terrain) terrain.set(d.terrain); }catch(_){ console.warn("[hexmapper] skipped malformed terrain"); }
try{ if(d.veg) veg.set(d.veg); }catch(_){ console.warn("[hexmapper] skipped malformed veg"); }
try{ if(d.entity) entity.set(d.entity); }catch(_){ console.warn("[hexmapper] skipped malformed entity"); }
try{
overlayEdges=new Map();
if(Array.isArray(d.edges)) d.edges.forEach(e=>{ try{ const n=normEdge(e); overlayEdges.set(edgeKeyOf(n.a,n.b),n); }catch(_){} });
else if(d.rivers||d.roads) seedEdgesFromTiles(d.rivers,d.roads);
}catch(_){ console.warn("[hexmapper] skipped malformed edges"); }
try{ texts=Array.isArray(d.texts)?d.texts:[]; }catch(_){}
selText=-1; dirty=true; updateDims(); syncTextPanel(); fitGrid(); render(); commit("load"); scheduleSave(true);
};
rd.readAsText(f);
});
document.getElementById("clear").onclick=()=>{ if(!confirm("Clear all hexes and labels?")) return; allocArrays(); overlayEdges=new Map(); texts=[]; selText=-1; dirty=true; syncTextPanel(); render(); commit("clear"); scheduleSave(true); };
// ===================== src/19-autosave.js =====================
let saveTimer=null; const STORE="hexmapper.v9";
function scheduleSave(force){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(doSave,force?0:500); }
function doSave(){
try{ localStorage.setItem(STORE,JSON.stringify({cols:COLS,rows:ROWS,
terrain:Array.from(terrain), veg:Array.from(veg), entity:Array.from(entity),
edges:[...overlayEdges.values()].map(e=>({a:e.a,b:e.b,river:e.river,road:e.road})),
texts, cam})); }catch(_){}
}
function loadSaved(){
try{
const s=localStorage.getItem(STORE);
if(!s){ loadExampleImage(); return; }
const d=JSON.parse(s);
if(d.terrain){ for(let i=0;i<d.terrain.length;i++){ const t=d.terrain[i]; if(t!==0 && !TERR[t]) throw new Error("unknown terrain id "+t); } }
if(d.cols&&d.rows){ COLS=d.cols; ROWS=d.rows; recomputeGrid(); allocArrays(); }
if(d.terrain) terrain.set(d.terrain); if(d.veg) veg.set(d.veg); if(d.entity) entity.set(d.entity); if(d.texts) texts=d.texts;
if(Array.isArray(d.edges)){ overlayEdges=new Map(d.edges.map(e=>{ const n=normEdge(e); return [edgeKeyOf(n.a,n.b),n]; })); }
else if(d.rivers||d.roads){ seedEdgesFromTiles(d.rivers,d.roads); }
if(d.cam){cam.x=d.cam.x;cam.y=d.cam.y;cam.z=d.cam.z;}
}catch(e){
console.warn("[hexmapper] could not load cached map ("+e.message+"); clearing cache.");
try{ localStorage.removeItem(STORE); }catch(_){}
COLS=100; ROWS=100; recomputeGrid(); allocArrays(); overlayEdges=new Map(); texts=[]; selText=-1;
}
}

// ===================== src/19b-autoreload.js =====================
// dev-only auto-reload: when node build.js --watch rewrites dist/app.js, the
// browser detects the new Last-Modified and refreshes. Skipped in standalone
// builds (where VERSION is defined and there's no separate app.js).
if(typeof VERSION === "undefined"){
var _lastMod = null;
setInterval(function(){
fetch("dist/app.js", { method: "HEAD", cache: "no-store" })
.then(function(r){
var m = r.headers.get("last-modified");
if(_lastMod !== null && m !== _lastMod) location.reload();
_lastMod = m;
}).catch(function(){});
}, 1000);
}
// ===================== src/20-version.js =====================
// version check: compare against latest GitHub release (non-blocking)
(function(){
var VER = (typeof VERSION !== "undefined") ? VERSION : "dev";
if(VER === "dev") return;
setTimeout(function(){
fetch("https://api.github.com/repos/UnwiseDevLtd/hexmapper/releases/latest")
.then(function(r){ return r.json(); })
.then(function(d){
if(d && d.tag_name && d.tag_name !== VER){
console.log("[hexmapper] Update available: " + d.tag_name + " (you have " + VER + ")");
var n = document.createElement("div");
n.style.cssText = "position:fixed;bottom:8px;right:8px;background:#6ea8fe;color:#fff;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;z-index:99;font-family:sans-serif";
n.textContent = "Update available: " + d.tag_name;
n.onclick = function(){ window.open("https://github.com/UnwiseDevLtd/hexmapper/releases"); };
document.body.appendChild(n);
setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 15000);
}
})
.catch(function(){});
}, 3000);
})();
