<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Mapper</title>
<style>
  :root{
    --bg:#1b1d22; --panel:#252830; --panel2:#2e323c; --line:#3a3f4b;
    --tx:#e7e9ee; --dim:#9aa0ad; --acc:#6ea8fe; --acc2:#84d6a1; --warn:#e27075;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font:13px/1.4 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;display:flex;overflow:hidden}
  /* left: app (toolbar + canvas) */
  #app{flex:1;display:flex;flex-direction:column;min-width:0}
  /* toolbar */
  #toolbar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:4px 6px;flex-wrap:wrap;min-height:36px}
  .tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--tx);font:inherit;font-size:11px;white-space:nowrap}
  .tbtn:hover{border-color:var(--acc)}
  .tbtn.on{border-color:var(--acc);background:#2c3243}
  .sep{width:1px;height:18px;background:var(--line);margin:0 2px;flex-shrink:0}
  .spacer{margin-left:auto}
  /* dropdown */
  .dropdown{position:relative}
  .dropdown-menu{display:none;position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;z-index:100;min-width:130px;max-height:400px;overflow-y:auto}
  .dropdown:hover .dropdown-menu,.dropdown.open .dropdown-menu{display:block}
  .ditem{display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;color:var(--tx);font-size:12px;border-radius:4px;width:100%;text-align:left;background:none;border:none}
  .ditem:hover{background:var(--panel2)}
  .ditem.on{color:var(--acc)}
  .ditem .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.3)}
  .dsub{font-size:9px;color:var(--dim);margin:3px 0 1px;padding-top:2px;border-top:1px solid var(--line)}
  /* status bar */
  #bar{height:26px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 10px;font-size:11px;color:var(--dim)}
  #bar b{color:var(--tx)}
  /* stage */
  #stage{flex:1;position:relative;overflow:hidden;cursor:crosshair;background:#15161a}
  #stage.panning{cursor:grab}
  #stage.panning:active{cursor:grabbing}
  #stage.textmode{cursor:text}
  canvas{position:absolute;inset:0;display:block;touch-action:none}
  /* right dock */
  #dock{width:200px;flex:0 0 200px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #dock-scroll{flex:1;overflow-y:auto;padding:8px}
  .dock-footer{flex-shrink:0;padding:6px 8px;text-align:center;font-size:10px;border-top:1px solid var(--line)}
  .dock-footer a{color:var(--dim);text-decoration:none}
  /* collapses in dock */
  .collapse{margin-bottom:4px}
  .collapse-head{display:flex;align-items:center;gap:6px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--tx);font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
  .collapse-head:hover{border-color:var(--acc)}
  .collapse-head .ttl{flex:1}
  .collapse-head .caret{color:var(--dim);transition:transform .15s}
  .collapse.open .collapse-head .caret{transform:rotate(90deg)}
  .collapse-body{display:none;padding:6px 2px 2px}
  .collapse.open .collapse-body{display:block}
  /* form elements */
  label{display:block;margin:6px 0 2px;color:var(--dim);font-size:10px}
  input[type=range]{width:100%}
  input[type=text],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 6px;font-size:11px;font-family:inherit}
  input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:4px;flex-wrap:wrap}
  .row.tight{gap:3px}
  button.act{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 6px;cursor:pointer;font-size:11px;flex:1}
  button.act:hover{border-color:var(--acc)}
  button.act.on{border-color:var(--acc);background:#2c3243}
  button.act.danger{color:#f4b3b6}
  button.act.danger:hover{border-color:var(--warn)}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  input[type=file]{display:none}
  .filebtn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px;width:100%;text-align:center}
  .filebtn:hover{border-color:var(--acc)}
  .hint{color:var(--dim);font-size:10px;margin-top:3px}
  code{background:var(--bg);padding:1px 4px;border-radius:3px;color:var(--acc2);font-size:10px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:11px;cursor:pointer}
  .chk input{margin:0}
  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,80,140,.25);border:2px dashed var(--acc);pointer-events:none;font-size:16px;color:var(--tx)}
  #stage.drag #drop{display:flex}
  #textpanel{background:#1f2229;border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:4px}
</style>
</head>
<body>

<div id="app">
  <div id="toolbar"></div>
  <div id="bar">
    <span>Tool: <b id="curtool">Trees</b></span>
    <span>Hex: <b id="curhex">—</b></span>
    <span>Zoom: <b id="curzoom">100%</b></span>
    <span style="margin-left:auto" id="dims">100 × 100 hexes</span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="drop">Drop image to use as background</div>
  </div>
</div>

<div id="dock">
  <div id="dock-scroll">

    <div id="textpanel" style="display:none">
      <div class="hint" id="texthint" style="margin:0 0 4px">Click the map to add a label.</div>
      <label>Label</label>
      <input id="txt" type="text" placeholder="Label text…" autocomplete="off">
      <label>Font size <span id="tsv">14</span></label>
      <input id="txtsize" type="range" min="6" max="48" value="14">
      <div class="row" style="margin-top:6px">
        <button class="act danger" id="txtdelete" disabled>Delete</button>
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Background</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <label class="filebtn" for="bgfile" id="bglabel">Upload map image…</label>
        <input type="file" id="bgfile" accept="image/*">
        <div class="hint" id="bgstatus">No background loaded.</div>
        <label>Opacity <span id="opv">45%</span></label>
        <input type="range" id="bgop" min="0" max="100" value="45">
        <label>Scale <span id="scv">100%</span></label>
        <input type="range" id="bgscale" min="20" max="400" value="100">
        <label>Nudge X / Y</label>
        <div class="row">
          <input type="range" id="bgx" min="-400" max="400" value="0" style="flex:1">
          <input type="range" id="bgy" min="-400" max="400" value="0" style="flex:1">
        </div>
        <label>Backdrop <input type="color" id="bgcol" value="#ffffff" style="width:100%;height:22px;margin-top:2px"></label>
        <div class="row" style="margin-top:4px">
          <button class="act" id="bgfit">Fit</button>
          <button class="act" id="bgclear">Remove</button>
        </div>
        <label class="chk" style="margin-top:4px"><input type="checkbox" id="bgabove"> Above tiles</label>
      </div>
    </div>

    <div class="collapse open">
      <button class="collapse-head" type="button"><span class="ttl">Map style</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row tight">
          <button class="act on" data-vs="color">Colour</button>
          <button class="act" data-vs="bw">B&amp;W</button>
        </div>
        <label>Density <span id="hdv">50%</span></label>
        <input type="range" id="hdens" min="10" max="100" value="50">
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Grid</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row tight">
          <label style="margin:0;flex:1">Cols <input type="number" id="colsin" value="100" min="1" max="400" style="margin-top:2px"></label>
          <label style="margin:0;flex:1">Rows <input type="number" id="rowsin" value="100" min="1" max="400" style="margin-top:2px"></label>
        </div>
        <div class="row" style="margin-top:4px">
          <button class="act" id="dimapply">Apply</button>
          <button class="act" id="rotate">Rotate</button>
        </div>
        <label class="chk" style="margin-top:4px"><input type="checkbox" id="idshow"> Hex IDs (BC-23)</label>
        <label>Size <span id="idsv">9</span></label>
        <input type="range" id="idsz" min="6" max="20" value="9">
        <div class="row tight" style="margin-top:4px">
          <button class="act" id="idbg">BG: none</button>
          <button class="act" id="idpos">Pos: center</button>
        </div>
      </div>
    </div>

    <div class="collapse">
      <button class="collapse-head" type="button"><span class="ttl">Export</span><span class="caret">▸</span></button>
      <div class="collapse-body">
        <div class="row">
          <button class="act" id="export">PNG</button>
          <button class="act" id="save">JSON</button>
        </div>
        <label class="filebtn" for="loadfile" style="margin-top:4px">Load JSON…</label>
        <input type="file" id="loadfile" accept="application/json,.json">
        <div class="row" style="margin-top:6px">
          <button class="act" id="zin">Zoom +</button>
          <button class="act" id="zout">Zoom −</button>
        </div>
        <div class="row tight" style="margin-top:3px">
          <button class="act" id="zfit">Fit</button>
          <button class="act" id="z1">1:1</button>
          <button class="act" id="undo" disabled>↶</button>
          <button class="act" id="redo" disabled>↷</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="act danger" id="clear">Clear all</button>
        </div>
        <div class="hint" style="margin-top:6px">Right-click erases · <code>Ctrl+Z</code>/<code>Ctrl+Shift+Z</code></div>
      </div>
    </div>

  </div>
  <div class="dock-footer">
    <a href="https://codeberg.org/UnwiseDev/hexmapper" target="_blank">Codeberg</a> · <a href="https://www.patreon.com/cw/UnwiseDev" target="_blank">Patreon</a>
  </div>
</div>

<script src="dist/app.js"></script>
</body>
</html>
